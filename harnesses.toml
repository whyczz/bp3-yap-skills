# Harness rendering matrix. Data, not code: adding a harness is a row here
# plus a test that its rendered output loads. Invocation values are format
# strings with one {skill} placeholder.

[harness.pi]
display = "pi"
skills_dir = ".pi/skills"
invocation = "/skill:{skill}"
tested = true

[harness.claude]
display = "Claude"
skills_dir = ".claude/skills"
invocation = "/{skill}"
tested = false

[harness.codex]
display = "Codex"
skills_dir = ".agents/skills"
invocation = "${skill}"
tested = false

[harness.muse]
display = "Muse"
skills_dir = ".agents/skills"
invocation = "/{skill}"
tested = false
